# Smithery configuration for Cálculo de Juros e Multa
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_calculo-juros-e-multa

name: calculo-juros-e-multa-mcp
displayName: "Cálculo de Juros e Multa"
description: >
  **Cálculo de juros e multa** para IA. Aplique juros simples ou compostos, multa e correção oficial sobre qualquer valor em atraso, com índices ao vivo do BACEN e IBGE. Sem login.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/calculo-juros-e-multa-mcp
repository: https://github.com/mcp-dir/calculo-juros-e-multa-mcp

tags:
  - juridico
  - legal
  - juros
  - multa
  - correcao-monetaria
  - brazil
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_calculo-juros-e-multa

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_calculo-juros-e-multa/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
